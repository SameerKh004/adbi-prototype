<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Belt website prototype</title>
<meta name="description" content="Working prototype of the website and management system for the Afghanistan Green Belt Initiative. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Noto+Sans+Arabic:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field ledger. Map first on the public side, ledger tables in the admin. Summary before detail; every public number links to its records. */
:root{
  --bg:#f3f5f1; --surface:#fbfcfa; --surface-2:#eef2ec; --surface-3:#e4eae2;
  --ink:#1b2a22; --ink-2:#47574e; --ink-3:#6f7d75;
  --line:#dce3da; --line-2:#c6d0c4;
  --brand:#1d5c3f; --brand-2:#164a32; --brand-ink:#ffffff; --brand-soft:#e1eee5;
  --leaf:#2f8a46; --water:#2a78d6; --seed:#b5740d;
  --good:#1d7238; --good-bg:#e0f1e5; --warn:#875800; --warn-bg:#fbefd0; --crit:#b02e2e; --crit-bg:#f8e0df;
  --info:#235fa8; --info-bg:#e1ebf8; --mute:#56645c; --mute-bg:#e6eae5;
  --map-bg:#14201a; --map-land:#22332a; --map-edge:#89aa96; --map-grid:#1c2b23; --map-text:#d9e4dd;
  --font-display:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-arabic:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 10px 28px rgba(20,40,30,.10);
  --chrome-h:96px;
  --flow-in-fill:rgba(47,138,70,.18); --flow-in-line:#2f8a46; --flow-out-fill:#1d5c3f; --flow-out-line:#1d5c3f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#141b17; --surface-2:#1a231e; --surface-3:#212c26;
    --ink:#e6ede8; --ink-2:#b2bfb7; --ink-3:#8a988f;
    --line:#26312b; --line-2:#34423a;
    --brand:#3f9d68; --brand-2:#52b27b; --brand-ink:#07130c; --brand-soft:#1b2e22;
    --leaf:#3fa35a; --water:#4a90e2; --seed:#b8780f;
    --good:#62c47e; --good-bg:#15291c; --warn:#f0b54a; --warn-bg:#2e2512; --crit:#f07c76; --crit-bg:#341b1a;
    --info:#86b4ef; --info-bg:#152437; --mute:#a9b5ad; --mute-bg:#222b26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
    --flow-in-fill:rgba(98,196,126,.16); --flow-in-line:#62c47e; --flow-out-fill:#2b7550; --flow-out-line:#3f9d68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#141b17; --surface-2:#1a231e; --surface-3:#212c26;
  --ink:#e6ede8; --ink-2:#b2bfb7; --ink-3:#8a988f;
  --line:#26312b; --line-2:#34423a;
  --brand:#3f9d68; --brand-2:#52b27b; --brand-ink:#07130c; --brand-soft:#1b2e22;
  --leaf:#3fa35a; --water:#4a90e2; --seed:#b8780f;
  --good:#62c47e; --good-bg:#15291c; --warn:#f0b54a; --warn-bg:#2e2512; --crit:#f07c76; --crit-bg:#341b1a;
  --info:#86b4ef; --info-bg:#152437; --mute:#a9b5ad; --mute-bg:#222b26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --flow-in-fill:rgba(98,196,126,.16); --flow-in-line:#62c47e; --flow-out-fill:#2b7550; --flow-out-line:#3f9d68;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[dir="rtl"]{font-family:var(--font-arabic)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:var(--font-arabic);letter-spacing:0}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:"wdth" 112;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.4vw,50px);font-weight:780;letter-spacing:-.012em}
h2{font-size:clamp(20px,2.3vw,26px);font-weight:730}
h3{font-size:17px;font-weight:690}
p{margin:0}
a{color:var(--brand);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.num,.tbl td.r,.v{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ribbon + top bar */
.chrome{position:sticky;top:0;z-index:60}
.ribbon{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:6px 16px;background:var(--ink);color:var(--bg);font-size:13px;text-align:center}
.ribbon b{font-weight:700}
.rb-short{display:none}
.ribbon button{background:none;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.ribbon button:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:740;font-variation-settings:"wdth" 106;line-height:1.1;background:none;border:0;padding:0;cursor:pointer;text-align:start}
.mark{width:36px;height:36px;flex:none}
.doc .mark{width:44px;height:44px}
.brand .short{display:none}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);font-family:var(--font-body);font-variation-settings:"wdth" 100}
.nav{display:flex;gap:2px;margin-inline-start:8px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:580;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg.lang button{font-size:13px;padding:5px 9px}
.seg.lang button[lang="ps"],.seg.lang button[lang="fa"]{font-family:var(--font-arabic)}
@media (max-width:900px){
  .chrome{position:static}
  .toasts{top:12px}
  .topbar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .brand .long{display:none}
  .brand .short{display:inline}
  .brand small{display:none}
  .nav{order:3;width:100%;overflow-x:auto;margin:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .tools{gap:6px}
}

/* public pages */
.page{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:36px;align-items:center}
.hero .lede{font-size:18px;color:var(--ink-2);max-width:50ch;margin-top:16px}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.mini-map{height:380px;border-radius:var(--r-l);position:relative;cursor:pointer;box-shadow:var(--shadow)}
.mini-map .gm-open{position:absolute;inset-inline-end:12px;bottom:12px;z-index:5}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:22px}.mini-map{height:250px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:999px;border:1px solid transparent;font-weight:640;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{background:none;color:var(--brand);padding-inline:6px}
.btn-quiet:hover{text-decoration:underline}
.btn-sm{padding:6px 12px;font-size:13.5px}
.btn-danger{background:var(--surface);border-color:var(--line-2);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px}

.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-top:40px}
.fig{padding:16px 16px 14px;border-inline-end:1px solid var(--line);display:grid;gap:2px;align-content:start}
.fig:last-child{border-inline-end:0}
.fig .v{font-family:var(--font-display);font-size:30px;font-weight:740;font-variation-settings:"wdth" 104;line-height:1.1}
[dir="rtl"] .fig .v{font-family:var(--font-arabic)}
.fig .l{color:var(--ink-2);font-size:13.5px}
.fig .link{justify-self:start;margin-top:4px}
@media (max-width:600px){.rb-long{display:none}.rb-short{display:inline}.ribbon{gap:6px 10px;padding:6px 10px}}
@media (max-width:560px){.figures{grid-template-columns:1fr 1fr}.fig{border-bottom:1px solid var(--line)}.fig:nth-child(2n){border-inline-end:0}.fig .v{font-size:25px}}

.section{margin-top:52px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.section-head p{color:var(--ink-2);max-width:62ch;margin-top:4px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px}
@media (max-width:860px){.cols{grid-template-columns:1fr;gap:28px}}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 6px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:start;cursor:pointer;color:inherit}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:650}
.row .d{color:var(--ink-3);font-size:13px}
.row .r{text-align:end;font-size:13.5px;color:var(--ink-2)}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.trees{background:var(--leaf)}.dot.dams{background:var(--water)}.dot.nursery{background:var(--seed)}

.feed{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.feed li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.feed time{color:var(--ink-3);font-size:13px;padding-top:1px}
.feed .what{font-weight:600}
.feed .where{color:var(--ink-3);font-size:13px}

.honour{display:flex;flex-wrap:wrap;gap:8px}
.honour span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.honour span b{font-weight:650}
.honour span i{font-style:normal;color:var(--ink-3);font-size:12.5px;margin-inline-start:4px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:640;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--mute-bg);color:var(--mute)}
.pill.nodot::before{display:none}

/* panels and cards (used sparingly) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
.note{font-size:13px;color:var(--ink-3);margin-top:8px;max-width:70ch}
.callout{border-inline-start:3px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px}
[dir="rtl"] .callout{border-radius:var(--r-s) 0 0 var(--r-s)}

/* forms */
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-weight:640;font-size:14px}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%;min-height:42px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--water);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line-2);border-radius:999px;cursor:pointer;background:var(--surface);font-size:14px;user-select:none}
.check:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:620}
.check input{accent-color:var(--brand);margin:0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.consent input{margin-top:3px;accent-color:var(--brand);flex:none;width:17px;height:17px}
.err{color:var(--crit);font-size:13px;font-weight:560}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:24px}
@media (max-width:600px){.form-card{padding:18px}}
.done{border:1px solid var(--good);background:var(--good-bg);border-radius:var(--r-m);padding:18px;display:grid;gap:10px}
.done h3{color:var(--good)}

.amounts{display:flex;flex-wrap:wrap;gap:8px}
.amounts button{padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:640;font-variant-numeric:tabular-nums}
.amounts button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* map */
.gm{position:relative;overflow:hidden;background:var(--map-bg);user-select:none;-webkit-user-select:none;isolation:isolate;outline-offset:-3px}
.gm.interactive{touch-action:none;cursor:grab}
.gm.dragging{cursor:grabbing}
.gm-tiles,.gm-labels,.gm-markers{position:absolute;inset:0}
.gm-tiles{z-index:1}
.gm-tiles img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.gm-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.gm-labels{pointer-events:none;z-index:3}
.gm-markers{pointer-events:none;z-index:4}
.gm-city{position:absolute;left:0;top:0;font-size:11.5px;color:var(--map-text);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000;font-family:var(--font-body)}
.gm-city::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-inline-end:5px;vertical-align:middle;box-shadow:0 0 2px #000}
.gm-marker{position:absolute;left:0;top:0;pointer-events:auto;width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.55);padding:0;background:var(--c);color:var(--c)}
.gm-marker.both{background:conic-gradient(var(--leaf) 0 50%,var(--water) 50% 100%)}
.gm-marker svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gm-marker.planned{background:#fff;border:2px dashed var(--c)}
.gm-marker.planned svg{stroke:var(--c)}
.gm-marker.sel{width:40px;height:40px;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 3px 12px rgba(0,0,0,.6);z-index:3}
.gm-marker.sel svg{width:20px;height:20px}
.gm-marker.pick{background:#fff;border-color:var(--crit);width:22px;height:22px}
.gm-mlabel{position:absolute;left:0;top:0;pointer-events:none;font-size:12.5px;font-weight:680;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000,0 0 6px rgba(0,0,0,.7);white-space:nowrap;font-family:var(--font-body)}
.gm-cluster{position:absolute;left:0;top:0;pointer-events:auto;min-width:34px;height:34px;padding:0 8px;border-radius:999px;border:2px solid #fff;background:var(--brand);color:#fff;font-weight:760;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.6);display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.gm-ctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:6}
.gm-ctl button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.95);color:#1b2a22;cursor:pointer;display:grid;place-items:center;padding:0;font-size:19px;font-weight:600;line-height:1}
.gm-ctl button:hover{background:#fff}
.gm-ctl button[disabled]{opacity:.5;cursor:not-allowed}
.gm-ctl svg{width:18px;height:18px;stroke:#1b2a22;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gm-attr{position:absolute;right:6px;bottom:4px;font-size:10.5px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px #000;z-index:6;pointer-events:none;max-width:70%;text-align:right}
.gm-scale{position:absolute;left:12px;bottom:10px;z-index:6;pointer-events:none;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.gm-scale i{display:block;height:7px;border:2px solid #fff;border-top:0;margin-top:2px;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.gm-note{position:absolute;top:12px;left:12px;z-index:6;max-width:min(330px,calc(100% - 70px));background:rgba(12,20,16,.86);color:#e6efe9;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4}
.gm-note b{font-weight:700}
.gm-note{padding-inline-end:30px}
.gm-note-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}
.gm-legend{position:absolute;left:12px;bottom:34px;z-index:6;background:rgba(12,20,16,.82);color:#e6efe9;border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px;pointer-events:none}
.gm-legend span{display:flex;align-items:center;gap:7px}
.gm-legend .dot.hollow{background:#fff;border:2px dashed #9fb5a8;width:11px;height:11px}
.mini-map .gm-legend,.mini-map .gm-ctl{display:none}

.map-page{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:calc(100vh - var(--chrome-h));height:calc(100dvh - var(--chrome-h));min-height:520px}
.map-page>.gm{height:100%}
.map-side{overflow:auto;background:var(--surface);border-inline-start:1px solid var(--line);min-width:0}
.map-filters{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.map-side .rows{border-top:0}
.map-side .row{padding:12px 18px}
@media (max-width:860px){
  .map-page{grid-template-columns:1fr;height:auto;min-height:0}
  .map-page>.gm{height:56vh;min-height:330px}
  .map-side{border:0;overflow:visible}
  .map-filters{position:static}
}

/* site detail */
.sp-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sp-head .back{justify-self:start}
.sp-head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.coords{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sp-tabs{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;overflow-x:auto}
.sp-tabs button{border:0;background:none;padding:7px 11px;border-radius:8px;cursor:pointer;font-weight:620;color:var(--ink-2);white-space:nowrap}
.sp-tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
.sp-body{padding:16px 20px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.sp-body h4{margin:0 0 8px;font-size:14px;font-weight:700}
.mfig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfig>div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:grid;gap:4px;align-content:start}
.mfig .v{font-family:var(--font-display);font-weight:740;font-size:22px;line-height:1.1}
.mfig .l{font-size:12.5px;color:var(--ink-2)}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--leaf);border-radius:999px}
.bar.water>span{background:var(--water)}
.bar.money>span{background:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.catbars{display:grid;gap:8px}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.catbar .bar{grid-column:1/-1;height:6px}
.catbar .bar>span{background:var(--brand)}
.method{font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--line-2);padding-top:10px}

/* admin */
.admin{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - var(--chrome-h))}
.aside{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;position:sticky;top:var(--chrome-h);align-self:start;height:calc(100vh - var(--chrome-h));overflow:auto;display:grid;align-content:start;gap:16px}
.whoami{display:grid;gap:6px;padding:0 4px}
.whoami label{font-size:12.5px;color:var(--ink-3);font-weight:600}
.whoami select{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);font-weight:600;width:100%}
.anav{display:grid;gap:2px}
.anav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:580}
.anav a:hover{background:var(--surface-2);color:var(--ink)}
.anav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.badge{min-width:22px;padding:0 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:760;text-align:center;line-height:20px}
.admin-main{padding:24px 28px 72px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
.admin-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.admin-head p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.admin-head .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  .admin{grid-template-columns:1fr}
  .aside{position:static;height:auto;border:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}
  .anav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}
  .anav::-webkit-scrollbar{display:none}
  .anav a{white-space:nowrap;padding:7px 11px}
  .admin-main{padding:16px 14px 64px}
}

.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.attn button{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:start}
.attn button:hover{border-color:var(--warn)}
.attn .n{grid-row:span 2;font-family:var(--font-display);font-weight:780;font-size:26px;color:var(--warn);font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.attn .n.zero{color:var(--good)}
.attn .a{font-weight:640}
.attn .b{font-size:12.5px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;display:grid;gap:2px}
.kpi .v{font-family:var(--font-display);font-size:25px;font-weight:740;line-height:1.15}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:560}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select{padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-height:38px}
.toolbar input[type=search]{min-width:200px;flex:1 1 200px;max-width:320px}
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button+button{border-inline-start:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.tabs .c{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--surface-2);text-align:start;font-weight:650;color:var(--ink-2);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nowrap{white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl tbody tr.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{background:var(--warn-bg)}100%{background:transparent}}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.tbl .sub{font-size:12.5px;color:var(--ink-3)}
.id{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.tbl-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}

.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;gap:10px;align-content:start}
.event .date{font-family:var(--font-display);font-weight:740;font-size:15px}
.event .names{font-size:13px;color:var(--ink-2)}

/* modal, toast, tooltip */
.modal-back{position:fixed;inset:0;background:rgba(9,16,12,.62);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r-l);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:min(900px,100%)}
.modal>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.modal>header h2{font-size:19px}
.modal .x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.modal>footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal .pick-map{height:240px;border-radius:10px}
@media (max-width:600px){.modal-back{padding:0;align-items:end}.modal{border-radius:16px 16px 0 0;max-height:94vh}}
.toasts{position:fixed;top:calc(var(--chrome-h) + 12px);left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:560;font-size:14px}
.tip{white-space:pre-line;position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:12.5px;max-width:280px;line-height:1.4;box-shadow:var(--shadow)}

.doc{border:1px solid var(--line-2);border-radius:12px;padding:22px;position:relative;overflow:hidden;background:var(--surface);display:grid;gap:12px}
.doc::after{content:attr(data-stamp);position:absolute;inset:0;display:grid;place-items:center;font:800 64px/1 var(--font-display);color:var(--crit);opacity:.09;transform:rotate(-16deg);pointer-events:none;letter-spacing:.04em}
.doc .top{display:flex;justify-content:space-between;gap:14px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:12px}
.doc .amt{font-family:var(--font-display);font-size:30px;font-weight:780}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible;direction:ltr}
.chart text{fill:var(--ink-2);font-size:11.5px;font-family:var(--font-body)}
.chart .lbl-strong{fill:var(--ink);font-weight:680}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart-title{font-size:15px;font-weight:700;margin:0 0 2px}
.chart-sub{font-size:13px;color:var(--ink-3);margin-bottom:10px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>

/* ===== helpers used by the generator ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function addDays(iso, n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function pad(n,w){return String(n).padStart(w,'0');}

function makeSeed(){
  const rnd = mulberry32(20261123);
  const S = {v:DATA_VERSION, seq:{A:0,X:0,D:0,V:0,EV:0,DN:0,S:0,H:0}, sites:[], activities:[], expenses:[], donors:[], donations:[], volunteers:[], hours:[], events:[], audit:[]};
  for (const d of SITE_DEFS){
    S.sites.push({id:d.id,name:d.name,province:d.province,district:d.district,lat:d.lat,lng:d.lng,types:d.types.slice(),status:d.status,start:d.start,area:d.area,budget:d.budget,target:Object.assign({},d.target),species:d.species.slice(),desc:d.desc,shape:d.shape,ndvi:d.ndvi.slice()});
  }
  S.seq.S = SITE_DEFS.length;
  /* activities */
  const acts = [];
  for (const d of SITE_DEFS){
    (d.plant||[]).forEach(([date,qty],i)=>acts.push({siteId:d.id,type:'planting',date,qty,species:d.species[i%d.species.length],by:'field'}));
    (d.dams||[]).forEach(([date,qty,damType,storage])=>acts.push({siteId:d.id,type:'checkdam',date,qty,damType,storage,by:'field'}));
    (d.survival||[]).forEach(([date,qty,alive])=>acts.push({siteId:d.id,type:'survival',date,qty,alive,by:'field'}));
    (d.water||[]).forEach(([date,qty])=>acts.push({siteId:d.id,type:'maintenance',date,qty,note:'Watering by tanker',by:'field'}));
    (d.nursery||[]).forEach(([date,qty])=>acts.push({siteId:d.id,type:'nursery',date,qty,species:'Pine, locust, mulberry, olive and pomegranate',by:'field'}));
  }
  acts.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  acts.forEach(a=>{a.id='A-'+pad(++S.seq.A,4);S.activities.push(a);});

  /* expenses: each site's spending split across its work dates */
  const exps = [];
  for (const d of SITE_DEFS){
    const w = COST_PROFILES[d.profile];
    let dates = d.costDates ? d.costDates.slice() : [...new Set(acts.filter(a=>a.siteId===d.id && a.type!=='survival').map(a=>a.date))].sort();
    const siteRecs = [];
    for (const [cat, share] of Object.entries(w)){
      const amt = Math.round(d.spent*share);
      const n = Math.max(1, Math.min(cat==='labour'?4:2, dates.length));
      const parts = []; let left = amt;
      for (let i=0;i<n;i++){ const v = i===n-1 ? left : Math.round(amt/n*(0.8+rnd()*0.4)); parts.push(v); left -= v; }
      parts.forEach((v,i)=>{
        const idx = n===1 ? Math.floor(dates.length/2) : Math.round(i*(dates.length-1)/(n-1));
        let date = addDays(dates[Math.min(idx,dates.length-1)], 2+Math.floor(rnd()*6)); if (date > '2026-11-22') date = '2026-11-22';
        const vendors = VENDORS[cat]; const vendor = vendors[Math.floor(rnd()*vendors.length)];
        siteRecs.push({siteId:d.id,cat,date,vendor,amount:v,desc:expDesc(cat,v,d,rnd)});
      });
    }
    const diff = d.spent - siteRecs.reduce((s,x)=>s+x.amount,0); siteRecs[siteRecs.length-1].amount += diff;
    exps.push(...siteRecs);
  }
  /* office costs */
  for (let y=2025;y<=2026;y++) for (let m=1;m<=12;m++){
    if (y===2026 && m>11) break;
    const mm = `${y}-${pad(m,2)}`;
    exps.push({siteId:null,cat:'admin',date:mm+'-02',vendor:'Office rent, Jalalabad',amount:150,desc:'Office rent for the month'});
    exps.push({siteId:null,cat:'admin',date:mm+'-06',vendor:'Internet and phone',amount:35,desc:'Internet and phone credit'});
    exps.push({siteId:null,cat:'admin',date:(y===2026&&m===11)?mm+'-21':mm+'-27',vendor:'Bank charges',amount:10+Math.floor(rnd()*9),desc:'Bank and transfer charges'});
    if (m===6 || m===12) exps.push({siteId:null,cat:'admin',date:mm+'-20',vendor:'Accounting services',amount:200,desc:'Half-year bookkeeping and accounts'});
  }
  exps.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  exps.forEach((e,i)=>{
    e.id='X-'+pad(++S.seq.X,4);
    e.method = e.cat==='labour' ? 'cash' : (e.amount>400 ? 'bank' : (rnd()<0.6?'cash':'wallet'));
    e.receipt = true; e.status = 'Paid'; e.submittedBy = e.cat==='admin' ? 'finance' : 'field'; e.approvedBy = e.cat==='admin' ? 'founder' : 'finance'; e.paidOn = e.date;
  });
  /* a few records still moving through approval, and one missing receipt */
  const last = (pred)=>{for(let i=exps.length-1;i>=0;i--) if(pred(exps[i])) return exps[i]; return null;};
  const p1 = last(e=>e.siteId==='S01' && e.cat==='seedlings'); if (p1){p1.date='2026-11-19';p1.status='Submitted';p1.approvedBy=null;p1.paidOn=null;}
  const p2 = last(e=>e.siteId==='S06' && e.cat==='transport'); if (p2){p2.date='2026-11-20';p2.status='Submitted';p2.approvedBy=null;p2.paidOn=null;}
  const p3 = last(e=>e.cat==='admin' && e.vendor==='Bank charges'); if (p3){p3.status='Submitted';p3.approvedBy=null;p3.paidOn=null;p3.submittedBy='finance';}
  const p4 = last(e=>e.siteId==='S05' && e.cat==='labour'); if (p4){p4.date='2026-11-15';p4.status='Approved';p4.paidOn=null;}
  const p5 = exps.find(e=>e.siteId==='S06' && e.cat==='water'); if (p5){p5.receipt=false;}
  exps.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  S.expenses = exps;

  /* donors and donations */
  for (const [id,name,type,country,isPublic] of DONOR_DEFS){
    S.donors.push({id,name,type,country,email:name.toLowerCase().replace(/[^a-z]+/g,'.').replace(/^\.|\.$/g,'')+'@example.org',public:isPublic,since:null});
  }
  S.seq.DN = DONOR_DEFS.length;
  const dons = DONATION_DEFS.map(([donorId,date,amount,method,siteId,status])=>({donorId,date,amount,method,siteId,status}));
  dons.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const rseq = {};
  dons.forEach(d=>{
    d.id='D-'+pad(++S.seq.D,4);
    if (d.status==='Receipted'){const y=d.date.slice(0,4); rseq[y]=(rseq[y]||0)+1; d.receiptNo=`AGBI-R-${y}-${pad(rseq[y],4)}`; d.receiptDate=addDays(d.date,1);}
    d.recordedBy = 'finance';
  });
  S.receiptSeq = rseq;
  S.donations = dons;
  for (const dn of S.donors){ const f = dons.find(x=>x.donorId===dn.id); dn.since = f ? f.date : null; }

  /* volunteers, hours and events */
  for (const [id,name,province,district,phone,skills,avail,status,applied,recog,sessions] of VOL_DEFS){
    S.volunteers.push({id,name,province,district,phone,email:'',skills:skills.slice(),avail,status,applied,recog,consent:true});
    for (const [siteId,date,hours] of sessions){ S.hours.push({id:'H-'+pad(++S.seq.H,4),volId:id,siteId,date,hours,by:'coord'}); }
  }
  S.seq.V = VOL_DEFS.length;
  for (const [id,title,siteId,date,slots,vols] of EVENT_DEFS) S.events.push({id,title,siteId,date,slots,vols:vols.slice(),done:date<DEMO_TODAY});
  S.seq.EV = EVENT_DEFS.length;

  /* audit trail for the past fortnight */
  const actBy = (site,date)=>S.activities.find(a=>a.siteId===site && a.date===date && a.type==='planting');
  const A = (ts,role,action,ref,details)=>S.audit.push({ts,role,action,ref,details});
  const dByDate = (date)=>S.donations.find(d=>d.date===date);
  A('2026-11-02T10:41:00','finance','Recorded donation',dByDate('2026-11-02')?.id,'$250 by mobile wallet, for Surkh Rod Tree Nursery');
  A('2026-11-03T09:12:00','finance','Issued receipt',dByDate('2026-11-02')?.id,'Receipt '+(dByDate('2026-11-02')?.receiptNo||''));
  A('2026-11-07T17:32:00','field','Recorded activity',actBy('S06','2026-11-07')?.id,'1,200 trees planted at Balkh Sand-Dune Belt');
  A('2026-11-07T18:05:00','coord','Logged volunteer hours','EV01','16 hours for 2 volunteers at Autumn planting on the dunes');
  A('2026-11-10T09:30:00','finance','Recorded donation',dByDate('2026-11-10')?.id,'$600 through partner, for Balkh Sand-Dune Belt');
  A('2026-11-14T16:20:00','field','Recorded activity',actBy('S03','2026-11-14')?.id,'200 trees planted at Chaparhar Community Orchards');
  if (p4) A('2026-11-15T10:02:00','finance','Approved expense',p4.id,`$${p4.amount.toLocaleString('en-US')} labour at Paghman Slopes`);
  A('2026-11-18T17:45:00','field','Recorded activity',actBy('S01','2026-11-18')?.id,'200 trees planted at Khogyani Watershed');
  if (p1) A('2026-11-19T08:50:00','field','Submitted expense',p1.id,`$${p1.amount.toLocaleString('en-US')} seedlings for Khogyani Watershed`);
  A('2026-11-19T12:11:00','public','Volunteer application received','V013','Ehsanullah Zadran, Paktia');
  if (p2) A('2026-11-20T15:02:00','field','Submitted expense',p2.id,`$${p2.amount.toLocaleString('en-US')} transport for Balkh Sand-Dune Belt`);
  A('2026-11-20T15:30:00','finance','Recorded pledge',dByDate('2026-11-20')?.id,'$1,500 for Torkham Highway Shelterbelt');
  A('2026-11-21T10:22:00','public','Volunteer application received','V014','Mursal Akbari, Nangarhar');
  A('2026-11-21T11:05:00','finance','Submitted expense',p3?.id,'Bank and transfer charges');
  A('2026-11-21T16:40:00','finance','Recorded pledge',dByDate('2026-11-21')?.id,'$2,000, where needed most');
  A('2026-11-22T09:14:00','public','Volunteer application received','V016','Mujib Rahman Safi, Nangarhar');
  S.audit.reverse();
  return S;
}

function expDesc(cat, amount, d, rnd){
  const sp = (d.species[Math.floor(rnd()*d.species.length)]||'').split(' (')[0].toLowerCase();
  switch(cat){
    case 'seedlings': return d.profile==='nursery' ? `Seed, polybags and soil mix (${Math.round(amount/0.5).toLocaleString('en-US')} pots)` : `${Math.round(amount/0.65).toLocaleString('en-US')} ${sp} seedlings`;
    case 'labour': return `${Math.max(1,Math.round(amount/6)).toLocaleString('en-US')} worker-days at $6`;

    x.rate=x.surveyed?x.alive/x.surveyed:null;x.surviving=x.rate!=null?Math.round(x.trees*x.rate):x.trees;
    x.co2=x.surviving*CO2_PER_TREE_T;x.sediment=x.dams*SEDIMENT_PER_DAM_T;tot.co2+=x.co2;tot.sediment+=x.sediment;
    if(x.surveyed){tot.alive+=x.alive;tot.surveyed+=x.surveyed;}
    x.costPerTree=x.trees>0&&x.spent>0?x.spent/x.trees:null;}
  for(const a of S.activities)if(a.type==='planting'&&a.date.startsWith(yr))tot.treesYear+=a.qty;
  tot.rate=tot.surveyed?tot.alive/tot.surveyed:null;tot.balance=tot.received-tot.spent;tot.progShare=tot.spent?tot.programme/tot.spent:0;
  const treeSites=Object.values(sites).filter(x=>x.trees>0);tot.costPerTree=sum(treeSites,x=>x.spent)/Math.max(1,sum(treeSites,x=>x.trees));
  return {sites,tot,byCat,activeVols:S.volunteers.filter(v=>v.status==='Active').length,hours:sum(S.hours,h=>h.hours)};
}
function monthly(){
  const dates=[DEMO_TODAY,...S.donations.filter(d=>d.status!=='Pledged').map(d=>d.date),...S.expenses.filter(e=>e.status==='Paid').map(e=>e.paidOn||e.date)];
  const end=dates.reduce((a,b)=>b>a?b:a).slice(0,7);const out=[];let y=2025,m=1,cr=0,cs=0;
  while(`${y}-${pad2(m)}`<=end){const ym=`${y}-${pad2(m)}`;const r=sum(S.donations.filter(d=>d.status!=='Pledged'&&d.date.startsWith(ym)),d=>d.amount);const sp=sum(S.expenses.filter(e=>e.status==='Paid'&&(e.paidOn||e.date).startsWith(ym)),e=>e.amount);cr+=r;cs+=sp;out.push({ym,r,sp,cr,cs});m++;if(m>12){m=1;y++;}}
  return out;
}
function ndviSeries(s,x){
  const years=[2020,2021,2022,2023,2024,2025,2026];let seed=s.id.charCodeAt(1)*97+s.id.charCodeAt(2);const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const tgt=s.target.trees||s.target.dams||s.target.seedlings||1;
  return years.map(y=>{const cut=y+'-09-30';let done=0;for(const a of x.acts){if(a.date>cut)continue;if(a.type==='planting'&&s.target.trees)done+=a.qty/s.target.trees*(s.target.dams?0.6:1);if(a.type==='checkdam'&&s.target.dams)done+=a.qty/s.target.dams*(s.target.trees?0.4:1);if(a.type==='nursery')done+=a.qty/(tgt*2);}
    const f=Math.min(1,done);return {y,v:Math.max(0.02,s.ndvi[0]+s.ndvi[1]*f*0.9+(rnd()-0.5)*0.014)};});
}

function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(k*p>=v)return k*p;}return 10*p;}
function chartFlow(series){
  const W=720,H=260,l=52,r=150,top=14,b=30,iw=W-l-r,ih=H-top-b,n=series.length;
  const ymax=niceMax(Math.max(1,...series.map(p=>p.cr))*1.04);const X=i=>l+(n<2?0:i/(n-1))*iw,Y=v=>top+ih-v/ymax*ih;
  const ticks=[0,1,2,3,4].map(i=>ymax*i/4);
  const line=k=>series.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p[k]).toFixed(1)).join('');
  const area=k=>line(k)+`L${X(n-1).toFixed(1)},${Y(0)}L${X(0)},${Y(0)}Z`;
  const last=series[n-1],step=Math.max(1,Math.ceil(n/8));
  const short=v=>v>=1000?(L==='en'?'$':'')+nf(v/1000,v%1000?1:0)+'k':money(v);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('tr.flow'))}" dir="ltr">`;
  s+=ticks.map(v=>`<line class="grid" x1="${l}" x2="${l+iw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end">${esc(short(v))}</text>`).join('');
  s+=`<path d="${area('cr')}" style="fill:var(--flow-in-fill)"/><path d="${area('cs')}" style="fill:var(--flow-out-fill)"/>`;
  s+=`<path d="${line('cr')}" fill="none" style="stroke:var(--flow-in-line)" stroke-width="2"/><path d="${line('cs')}" fill="none" style="stroke:var(--flow-out-line)" stroke-width="2"/>`;
  s+=series.map((p,i)=>(i%step===0&&n-1-i>=step*0.7)||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(fd(p.ym+'-15',{day:undefined,month:'short',year:'2-digit'}))}</text>`:'').join('');
  const xe=X(n-1),yr=Y(last.cr),ys=Y(last.cs),gap=Math.max(28,ys-yr);
  s+=`<circle cx="${xe}" cy="${yr}" r="4" style="fill:var(--flow-in-line)"/><circle cx="${xe}" cy="${ys}" r="4" style="fill:var(--flow-out-line)"/>`;
  s+=`<text x="${xe+10}" y="${yr-2}" class="lbl-strong">${esc(t('tr.received'))} ${esc(money(last.cr))}</text>`;
  s+=`<text x="${xe+14}" y="${yr+gap/2+4}">${esc(t('tr.held'))} ${esc(money(last.cr-last.cs))}</text>`;
  s+=`<text x="${xe+10}" y="${yr+gap+8}" class="lbl-strong">${esc(t('tr.spent'))} ${esc(money(last.cs))}</text>`;
  s+=`<path d="M${xe+5},${yr+7}h4v${Math.max(4,ys-yr-14)}h-4" fill="none" style="stroke:var(--ink-3)"/>`;
  s+=series.map((p,i)=>{const x0=n<2?l:X(i)-iw/(n-1)/2,wd=n<2?iw:iw/(n-1);return `<rect class="hit" x="${Math.max(l,x0)}" y="${top}" width="${wd}" height="${ih}" data-tip="${esc(fmy(p.ym)+'\n'+t('tr.received')+': '+money(p.cr)+' (+'+money(p.r)+')\n'+t('tr.spent')+': '+money(p.cs)+' (+'+money(p.sp)+')')}"/>`;}).join('');
  return s+'</svg>';
}
function chartCats(byCat){

function chartNdvi(s,x){
  const data=ndviSeries(s,x),W=380,H=170,l=34,r=58,top=12,b=26,iw=W-l-r,ih=H-top-b;const ymax=Math.max(0.4,niceMax(Math.max(...data.map(d=>d.v))+0.05));
  const X=i=>l+i/(data.length-1)*iw,Y=v=>top+ih-v/ymax*ih;const path=data.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(d.v).toFixed(1)).join('');
  const startY=+s.start.slice(0,4),si=data.findIndex(d=>d.y===startY),lastD=data[data.length-1];

  o+=`<path d="${path}L${X(data.length-1)},${Y(0)}L${X(0)},${Y(0)}Z" style="fill:var(--leaf)" fill-opacity=".14"/><path d="${path}" fill="none" style="stroke:var(--leaf)" stroke-width="2"/>`;
  if(si>=0)o+=`<line x1="${X(si)}" x2="${X(si)}" y1="${top}" y2="${top+ih}" style="stroke:var(--ink-3)" stroke-dasharray="3 3"/><text x="${X(si)+4}" y="${top+10}">${esc(t('sd.workbegan'))}</text>`;
  o+=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.v)}" r="${i===data.length-1?4.5:3}" style="fill:${i===data.length-1?'var(--leaf)':'var(--surface)'};stroke:var(--leaf)" stroke-width="2" data-tip="${esc(nf(d.y)+': NDVI '+nf(d.v,2))}"/><text x="${X(i)}" y="${H-7}" text-anchor="middle">${esc(nf(d.y).replace(/[,٬]/g,''))}</text>`).join('');

function spMoney(s,x){

function ledgerRows(){

}

function counts(){return {applied:S.volunteers.filter(v=>v.status==='Applied').length,pledged:S.donations.filter(d=>d.status==='Pledged').length,toReceipt:S.donations.filter(d=>d.status==='Received').length,submitted:S.expenses.filter(e=>e.status==='Submitted').length,approved:S.expenses.filter(e=>e.status==='Approved').length};}

  <main class="admin-main" id="adminMain">${body}</main></div>`;
}
const head=(title,sub,acts)=>`<div class="admin-head"><div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const kpi=(v,l,s)=>`<div class="kpi"><span class="l">${esc(l)}</span><span class="v">${v}</span>${s?`<span class="s">${esc(s)}</span>`:''}</div>`;
const tabs=(page,items)=>`<div class="tabs" role="group">${items.map(([k,label,n])=>`<button type="button" data-act="atab" data-page="${page}" data-val="${k}" aria-pressed="${(UI.tab[page]||items[0][0])===k}">${esc(label)}${n!=null?`<span class="c">${n}</span>`:''}</button>`).join('')}</div>`;
const search=(page,ph)=>`<input type="search" data-act="aq" data-page="${page}" value="${esc(UI.q[page]||'')}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">`;
const sel=(page,key,label,opts)=>`<select data-act="af" data-page="${page}" data-key="${key}" aria-label="${esc(label)}"><option value="">${esc(label)}</option>${opts.map(([v,l])=>`<option value="${esc(v)}"${(UI.f[page+key]||'')===v?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
const roleLabel=r=>r==='public'?'Website form':roleName(r);

function aDashboard(M){
  const c=counts(),T0=M.tot,items=[];
  if(UI.role==='coord'||UI.role==='founder')items.push([c.applied,'Volunteer applications to review','admin-volunteers','Applied']);
  if(can('money')){items.push([c.pledged,'Pledges waiting for the money','admin-donations','Pledged']);items.push([c.toReceipt,'Receipts to issue','admin-donations','Received']);}
  if(can('approve')){items.push([c.submitted,'Expenses waiting for approval','admin-expenses','Submitted']);items.push([c.approved,'Approved expenses to pay','admin-expenses','Approved']);}
  if(UI.role==='field'){const mine=S.expenses.filter(e=>e.status==='Submitted'&&e.submittedBy==='field').length;items.push([mine,'Your expenses waiting for approval','admin-expenses','Submitted']);}
  const upcoming=S.events.filter(e=>e.date>=DEMO_TODAY).sort((a,b)=>a.date<b.date?-1:1);
  const k=[kpi(nf(T0.trees),'Trees planted',`${nf(T0.treesYear)} so far in ${DEMO_TODAY.slice(0,4)}`),kpi(nf(T0.dams),'Check dams built',`${nf(Math.round(T0.water/1000))} thousand m³ of runoff held a year (estimate)`),kpi(T0.rate!=null?pct(T0.rate):'–','Trees alive at last count',`${nf(T0.alive)} of ${nf(T0.surveyed)} counted`),kpi(nf(M.activeVols),'Active volunteers',`${nf(M.hours)} hours logged`)];
  if(can('money'))k.push(kpi(money(T0.received),'Donations received',`${money(T0.receivedYear)} in ${DEMO_TODAY.slice(0,4)}`),kpi(money(T0.spent),'Spent',`${money(T0.committed)} approved, not yet paid`),kpi(money(T0.balance),'Balance held',`${money(T0.pledged)} more pledged`),kpi(pct(T0.progShare),'Spent on field work',`${money(T0.admin)} on office costs`));
  return `${head('Dashboard','What needs attention, for your role: '+roleName(UI.role)+'.')}
  <div class="attn">${items.map(([n,a,to,tab])=>`<button type="button" data-act="goto-tab" data-to="${to}" data-tab="${tab}"><span class="n${n?'':' zero'}">${n}</span><span class="a">${esc(a)}</span><span class="b">${n?'Open the list':'Nothing waiting'}</span></button>`).join('')}</div>
  <div class="kpis">${k.join('')}</div>
  ${can('money')?`<div class="panel"><h3 class="chart-title">Money received and spent since January 2025</h3><p class="chart-sub">The gap between the lines is the balance held for planned work.</p>${chartFlow(monthly())}</div>`:''}
  <div class="split"><div class="panel"><h3 class="chart-title">Upcoming planting days</h3><div class="rows" style="margin-top:8px">${upcoming.map(e=>`<button type="button" class="row" data-act="go" data-to="admin-events"><span class="dots">${siteOf(e.siteId).types.map(k=>`<i class="dot ${k}"></i>`).join('')}</span><span><span class="t">${esc(e.title)}</span><br><span class="d">${esc(fd(e.date,{weekday:'short'}))}, ${esc(siteOf(e.siteId).name)}</span></span><span class="r">${e.vols.length} of ${e.slots} places filled</span></button>`).join('')}</div></div>
  <div class="panel"><h3 class="chart-title">Latest changes</h3><p class="chart-sub">Every change is kept in the audit trail.</p><ul class="feed">${S.audit.slice(0,7).map(a=>`<li><time>${esc(fdt(a.ts))}</time><div><div class="what">${esc(a.action)} <span class="id">${esc(a.ref||'')}</span></div><div class="where">${esc(a.details||'')}. ${esc(roleLabel(a.role))}</div></div></li>`).join('')}</ul>${can('audit')?`<button type="button" class="btn btn-ghost btn-sm" data-act="go" data-to="admin-audit" style="margin-top:10px">Open the audit trail</button>`:''}</div></div>`;
}

function aSites(M){

  return `${head('Sites and activities','Each site rolls up its own activity, spending and environmental figures. These numbers feed the public map directly.',`<button type="button" class="btn btn-primary btn-sm" data-act="new-activity">Record activity</button>${can('add-site')?`<button type="button" class="btn btn-ghost btn-sm" data-act="new-site">Add site</button>`:''}`)}
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Status</th><th class="r">Trees</th><th class="r">Check dams</th><th class="r">Alive</th><th class="r">Budget</th><th class="r">Spent</th><th>Last activity</th></tr></thead><tbody>${S.sites.map(s=>{const x=M.sites[s.id];return `<tr class="click" data-act="site-admin" data-id="${s.id}" data-row="${s.id}"><td><b>${esc(s.name)}</b><div class="sub">${esc(s.district)}, ${esc(s.province)} <span class="id">${s.id}</span></div></td><td>${statusPill(s)}</td><td class="r">${s.target.trees?`${nf(x.trees)} <span class="sub">/ ${nf(s.target.trees)}</span>`:'–'}</td><td class="r">${s.target.dams?`${nf(x.dams)} <span class="sub">/ ${nf(s.target.dams)}</span>`:'–'}</td><td class="r">${x.rate!=null?pct(x.rate):'–'}</td><td class="r">${money(s.budget)}</td><td class="r">${money(x.spent)}<div class="sub">${pct(x.spent/s.budget)}</div></td><td class="nowrap">${x.last?esc(fd(x.last)):'–'}</td></tr>`;}).join('')}</tbody></table></div>
  <div><h3 style="margin-bottom:10px">Latest activity records</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Record</th><th>Date</th><th>Site</th><th>Activity</th><th>Details</th><th>Recorded by</th></tr></thead><tbody>${recent.map(a=>actRow(a)).join('')}</tbody></table></div></div>`;
}
function actLabel(a){switch(a.type){case 'planting':return `${nf(a.qty)} trees planted`;case 'checkdam':return `${nf(a.qty)} check dams built`;case 'nursery':return `${nf(a.qty)} seedlings raised`;case 'survival':return `Survival count: ${nf(a.alive)} of ${nf(a.qty)} alive (${pct(a.alive/a.qty)})`;case 'maintenance':return `${nf(a.qty)} trees cared for`;default:return a.type;}}
function actRow(a){return `<tr data-row="${a.id}"><td class="id">${a.id}</td><td class="nowrap">${esc(fd(a.date))}</td><td>${esc(siteOf(a.siteId).name)}</td><td>${esc(actLabel(a))}</td><td class="sub">${esc(a.type==='planting'?a.species:a.type==='checkdam'?`${a.damType}, about ${a.storage} m³ each`:a.note||a.species||'')}</td><td class="sub">${esc(roleLabel(a.by))}</td></tr>`;}

function donationsFiltered(){

  <div class="toolbar">${tabs('admin-donations',[['all','All',all.length],['Pledged','Pledged',all.filter(d=>d.status==='Pledged').length],['Received','To receipt',all.filter(d=>d.status==='Received').length],['Receipted','Receipted',all.filter(d=>d.status==='Receipted').length]])}${search('admin-donations','Search donor, ID or receipt')}${sel('admin-donations','site','Any purpose',[['general','Where needed most'],...S.sites.map(s=>[s.id,s.name])])}</div>

function donStatus(d){return d.status==='Pledged'?'<span class="pill warn">Pledged</span>':d.status==='Received'?'<span class="pill info">Received, no receipt yet</span>':`<span class="pill good">Receipted</span><div class="sub">${esc(d.receiptNo||'')}</div>`;}

function donorsFiltered(){const q=(UI.q['admin-donors']||'').toLowerCase(),ty=UI.f['admin-donorstype']||'';return S.donors.filter(d=>!ty||d.type===ty).filter(d=>!q||(d.name+' '+d.id+' '+d.country+' '+d.email).toLowerCase().includes(q)).map(d=>{const g=S.donations.filter(x=>x.donorId===d.id&&x.status!=='Pledged');return {d,n:g.length,total:sum(g,x=>x.amount),last:g.reduce((a,x)=>x.date>a?x.date:a,'')};}).sort((a,b)=>b.total-a.total);}
function aDonors(){return `${head('Donors','Each donor has a full giving history and an impact statement you can send them.')}<div class="toolbar">${search('admin-donors','Search name, country or email')}${sel('admin-donors','type','Any type',[...new Set(S.donors.map(d=>d.type))].map(x=>[x,x]))}</div><div id="tbl">${donorsTable()}</div>`;}

function volsFiltered(){const tab=UI.tab['admin-volunteers']||'Applied',q=(UI.q['admin-volunteers']||'').toLowerCase(),pv=UI.f['admin-volunteersprov']||'';return S.volunteers.filter(v=>tab==='all'||v.status===tab).filter(v=>!pv||v.province===pv).filter(v=>!q||(v.name+' '+v.id+' '+v.district+' '+v.phone).toLowerCase().includes(q)).map(v=>({v,h:sum(S.hours.filter(h=>h.volId===v.id),h=>h.hours)})).sort((a,b)=>a.v.applied<b.v.applied?1:-1);}
function aVolunteers(){const V=S.volunteers;return `${head('Volunteers','New registrations from the public website arrive here as applications.',`<button type="button" class="btn btn-ghost btn-sm" data-act="go" data-to="volunteer">Open the public form</button>`)}
  <div class="toolbar">${tabs('admin-volunteers',[['Applied','Applications',V.filter(v=>v.status==='Applied').length],['Approved','Approved',V.filter(v=>v.status==='Approved').length],['Active','Active',V.filter(v=>v.status==='Active').length],['Inactive','Inactive',V.filter(v=>v.status==='Inactive').length],['all','All',V.length]])}${search('admin-volunteers','Search name, phone or ID')}${sel('admin-volunteers','prov','Any province',[...new Set(V.map(v=>v.province))].sort().map(p=>[p,p]))}</div><div id="tbl">${volsTable()}</div>`;}
function volStatus(v){return {Applied:'<span class="pill warn">Application</span>',Approved:'<span class="pill info">Approved</span>',Active:'<span class="pill good">Active</span>',Inactive:'<span class="pill mute">Inactive</span>',Declined:'<span class="pill crit">Declined</span>'}[v.status]||esc(v.status);}

function aEvents(){

function aExpenses(){const E=S.expenses;return `${head('Expenses','Every payment needs a receipt and a second person to approve it. Only paid expenses appear on the public site.',`<button type="button" class="btn btn-primary btn-sm" data-act="new-expense">Record expense</button>`)}
  <div class="toolbar">${tabs('admin-expenses',[['Submitted','To approve',E.filter(e=>e.status==='Submitted').length],['Approved','To pay',E.filter(e=>e.status==='Approved').length],['Paid','Paid',E.filter(e=>e.status==='Paid').length],['Rejected','Rejected',E.filter(e=>e.status==='Rejected').length],['all','All',E.length]])}${search('admin-expenses','Search supplier, description or ID')}${sel('admin-expenses','site','Any site',[['office','Office and administration'],...S.sites.map(s=>[s.id,s.name])])}${sel('admin-expenses','cat','Any category',EXP_CATS.map(c=>[c[0],c[1]]))}</div><div id="tbl">${expTable()}</div>`;}
function expStatus(e){return {Submitted:'<span class="pill warn">Waiting for approval</span>',Approved:'<span class="pill info">Approved, not paid</span>',Paid:'<span class="pill good">Paid</span>',Rejected:'<span class="pill crit">Rejected</span>'}[e.status];}
function expActions(e){

function openModal(title,body,footer,o){

  setTimeout(()=>{const f=back.querySelector('.body input:not([type=hidden]):not([type=checkbox]),.body select,.body textarea')||back.querySelector('footer button,.x');if(f)try{f.focus();}catch(e){}},40);

function closeModal(silent){const b=$('#modalBack');if(!b)return;if(pickMap){pickMap.destroy();pickMap=null;}b.remove();if(!silent&&modalReturn&&document.contains(modalReturn))try{modalReturn.focus();}catch(e){}}

const tip=document.createElement('div');tip.className='tip';tip.hidden=true;tip.style.whiteSpace='pre-line';
function showTip(el,x,y){const s=el.getAttribute('data-tip');if(!s)return;tip.textContent=s;tip.hidden=false;const r=tip.getBoundingClientRect();let left=x+14,top=y+14;if(left+r.width>innerWidth-8)left=x-r.width-14;if(top+r.height>innerHeight-8)top=y-r.height-14;tip.style.left=Math.max(8,left)+'px';tip.style.top=Math.max(8,top)+'px';}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true;});
document.addEventListener('mousemove',e=>{if(tip.hidden)return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom);}else tip.hidden=true;});

/* ===== numbers in words (receipts) ===== */
function words(n){n=Math.round(n);if(n===0)return 'zero';const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h=x=>{let s='';if(x>=100){s+=a[Math.floor(x/100)]+' hundred';x%=100;if(x)s+=' and ';}if(x>=20){s+=b[Math.floor(x/10)];if(x%10)s+='-'+a[x%10];}else if(x)s+=a[x];return s;};
  const parts=[];const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;if(m)parts.push(h(m)+' million');if(k)parts.push(h(k)+' thousand');if(r)parts.push((m||k)&&r<100?'and '+h(r):h(r));return parts.join(' ');}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function impactText(dn,M){
  const g=S.donations.filter(x=>x.donorId===dn.id&&x.status!=='Pledged');const total=sum(g,x=>x.amount);

  const bySite={};let general=0;for(const x of g){if(x.siteId)bySite[x.siteId]=(bySite[x.siteId]||0)+x.amount;else general+=x.amount;}
  const lines=Object.entries(bySite).map(([sid,amt])=>{const x=M.sites[sid];const s=x.s;let l=`- $${amt.toLocaleString('en-US')} for ${s.name}`;if(x.costPerTree)l+=`: about ${Math.floor(amt/x.costPerTree).toLocaleString('en-US')} trees planted and cared for`;else if(s.status==='planned')l+=`: held for the planting that starts ${fmy(s.start)}`;else if(s.types.includes('nursery'))l+=`: helping raise ${x.seedlings.toLocaleString('en-US')} seedlings so far`;if(x.rate!=null)l+=`. ${pct(x.rate)} of trees there were alive at the last count`;return l+'.';});
  if(general)lines.push(`- $${general.toLocaleString('en-US')} where needed most, shared across our ${S.sites.length} sites, where ${pct(M.tot.progShare)} of all spending goes to field work.`);
  return `Dear ${dn.name},\n\nThank you for giving $${total.toLocaleString('en-US')} since ${fmy(g.map(x=>x.date).sort()[0])}. Here is what your gifts have done:\n\n${lines.join('\n')}\n\nYou can see every site, payment and result on our public map.\n\nWith thanks,\nAfghanistan Green Belt Initiative`;

/* ===== downloads and copying ===== */
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied');}catch(e){openModal('Copy this text',`<textarea readonly rows="12" id="copyBox" style="width:100%;padding:12px;border:1px solid var(--line-2);border-radius:8px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace">${esc(text)}</textarea><p class="small muted">Select all and copy.</p>`,`<button type="button" class="btn btn-primary" data-act="close">Done</button>`);setTimeout(()=>{const b=$('#copyBox');if(b){b.focus();b.select();}},60);}}
async function download(name,text){
  try{
    if(window.claude&&typeof window.claude.use==='function'){const dl=await window.claude.use('downloads');if(!dl)throw {code:'unavailable'};await dl.save({filename:name,data:text});toast('Saved '+name);return;}
    const url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(err){if(err&&err.code==='declined')return;copyText(text);}
}

  'csv-copy':()=>copyText(ledgerCsv()),
  'csv-download':()=>download(UI.ledger==='donations'?'agbi-donations.csv':'agbi-payments.csv',ledgerCsv()),
  amount:el=>{UI.donate.amount=Number(el.dataset.val);UI.donate.custom=false;$$('[data-act="amount"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));const i=$('#f-amount');if(i)i.value='';$('#impact').innerHTML=impactLine(metrics());},
  'donate-again':()=>{UI.donate={amount:100,site:''};render(true);},
  'vol-again':()=>{UI.volDone=null;render(true);},
  'see-admin':el=>{const to=el.dataset.to;if(to==='admin-donations'){if(!can('donations'))UI.role='finance';UI.tab['admin-donations']='Pledged';}if(to==='admin-volunteers'){if(!canVol())UI.role='coord';UI.tab['admin-volunteers']='Applied';}saveUI();UI.flash=el.dataset.flash;UI.donate={amount:100,site:''};UI.volDone=null;navigate(to);},
  atab:el=>{UI.tab[el.dataset.page]=el.dataset.val;UI.expAll=false;render(false);},
  'goto-tab':el=>{UI.tab[el.dataset.to]=el.dataset.tab;navigate(el.dataset.to);},
  'exp-all':()=>{UI.expAll=true;$('#tbl').innerHTML=expTable();},
  'new-donation':el=>mDonation(el.dataset.donor),
  'new-expense':()=>mExpense(),
  'new-activity':el=>mActivity(el.dataset.site),
  'new-site':()=>mSite(),
  'new-event':()=>mEvent(),
  'site-admin':el=>mSiteAdmin(el.dataset.id),
  'public-site':el=>{closeModal(true);navigate('map',{siteId:el.dataset.id});},
  donor:el=>mDonor(el.dataset.id),
  'donor-public':el=>{const d=donorOf(el.dataset.id);d.public=!d.public;log('Changed public listing',d.id,d.public?'Now shown by name':'Now shown as anonymous');save();render(false);mDonor(d.id);toast(d.public?'Now shown by name':'Now shown as anonymous');},
  'don-received':el=>{const d=S.donations.find(x=>x.id===el.dataset.id);d.status='Received';d.date=today()>d.date?today():d.date;log('Confirmed money received',d.id,`$${d.amount.toLocaleString('en-US')}`);commit(`${d.id} confirmed. Now issue the receipt.`,d.id);},
  'don-receipt':el=>{const d=S.donations.find(x=>x.id===el.dataset.id);const y=today().slice(0,4);S.receiptSeq=S.receiptSeq||{};S.receiptSeq[y]=(S.receiptSeq[y]||0)+1;d.receiptNo=`AGBI-R-${y}-${pad(S.receiptSeq[y],4)}`;d.receiptDate=today();d.status='Receipted';log('Issued receipt',d.id,'Receipt '+d.receiptNo);save();render(false);mReceipt(d.id);},
  'view-receipt':el=>mReceipt(el.dataset.id),
  vol:el=>mVol(el.dataset.id),
  'vol-approve':el=>{const v=volOf(el.dataset.id);v.status='Approved';log('Approved volunteer',v.id,v.name);closeModal(true);commit(`${v.name} approved. Assign them to a planting day next.`,v.id);},
  'vol-decline':el=>{const v=volOf(el.dataset.id);v.status='Declined';log('Declined volunteer',v.id,v.name);closeModal(true);commit(`${v.name} declined`);},
  'vol-inactive':el=>{const v=volOf(el.dataset.id);v.status='Inactive';log('Marked volunteer inactive',v.id,v.name);closeModal(true);commit(`${v.name} marked inactive`,v.id);},
  'vol-reactivate':el=>{const v=volOf(el.dataset.id);v.status='Active';log('Reactivated volunteer',v.id,v.name);closeModal(true);commit(`${v.name} is active again`,v.id);},
  'vol-assign':el=>{const v=volOf(el.dataset.id),e=S.events.find(x=>x.id===$('#m-ev').value);if(!e)return;if(e.vols.length>=e.slots){toast('That planting day is full');return;}e.vols.push(v.id);log('Assigned volunteer',e.id,`${v.name} to ${e.title}`);save();render(false);mVol(v.id);toast(`${v.name} assigned to ${e.title}`);},
  'vol-hours':el=>{const v=volOf(el.dataset.id);const h=Math.max(1,Math.min(12,Number($('#m-hh').value)||0));const siteId=$('#m-hs').value,date=$('#m-hd').value||today();S.hours.push({id:'H-'+pad(++S.seq.H,4),volId:v.id,siteId,date,hours:h,by:UI.role});if(v.status==='Approved')v.status='Active';log('Logged volunteer hours',v.id,`${h} hours at ${siteOf(siteId).name}`);save();render(false);mVol(v.id);toast(`${h} hours logged for ${v.name}`);},
  'vol-cert':el=>mCert(el.dataset.id),
  'ev-assign':el=>mAssign(el.dataset.id),
  'ev-attend':el=>mAttend(el.dataset.id),
  exp:el=>mExpDetail(el.dataset.id),
  'exp-approve':el=>{const e=S.expenses.find(x=>x.id===el.dataset.id);if(e.submittedBy===UI.role){toast('You submitted this expense, so someone else has to approve it.');return;}e.status='Approved';e.approvedBy=UI.role;log('Approved expense',e.id,`$${e.amount.toLocaleString('en-US')} ${e.vendor}`);closeModal(true);commit(`${e.id} approved. It can now be paid.`,e.id);},
  'exp-reject':el=>{const e=S.expenses.find(x=>x.id===el.dataset.id);e.status='Rejected';e.approvedBy=UI.role;log('Rejected expense',e.id,`$${e.amount.toLocaleString('en-US')} ${e.vendor}`);closeModal(true);commit(`${e.id} rejected`,e.id);},
  'exp-pay':el=>{const e=S.expenses.find(x=>x.id===el.dataset.id);e.status='Paid';e.paidOn=today();log('Marked expense paid',e.id,`$${e.amount.toLocaleString('en-US')} ${e.vendor}`);closeModal(true);commit(`${e.id} paid. It now shows on the public site.`,e.id);},
  'copy-text':el=>copyText(el.dataset.text)
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.matches('input,select,textarea'))return;
  if(el.disabled)return;
  const fn=ACTIONS[el.dataset.act];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalBack')){closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="link"][data-act],tr.click[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='roleSel'){UI.role=el.value;saveUI();UI.tab={};render(false);toast('Now signed in as '+roleName(UI.role));return;}
  if(el.dataset.act==='af'){UI.f[el.dataset.page+el.dataset.key]=el.value;$('#tbl').innerHTML=tableFor(el.dataset.page);return;}
  if(el.dataset.act==='ledgersite'){UI.ledgerSite=el.value;UI.ledgerAll=false;$('#ledger').innerHTML=ledgerTable();return;}
  if(el.id==='f-site'){UI.donate.site=el.value;$('#impact').innerHTML=impactLine(metrics());}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.act==='aq'){UI.q[el.dataset.page]=el.value;$('#tbl').innerHTML=tableFor(el.dataset.page);return;}
  if(el.dataset.act==='ledgerq'){UI.ledgerQ=el.value;UI.ledgerAll=false;$('#ledger').innerHTML=ledgerTable();return;}
  if(el.id==='f-amount'){const v=Number(el.value);if(v>0){UI.donate.amount=v;UI.donate.custom=true;$$('[data-act="amount"]').forEach(b=>b.setAttribute('aria-pressed','false'));}else{UI.donate.custom=false;}$('#impact').innerHTML=impactLine(metrics());}
});
function tableFor(page){return ({'admin-donations':donationsTable,'admin-donors':donorsTable,'admin-volunteers':volsTable,'admin-expenses':expTable,'admin-audit':auditTable})[page]();}
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f);});
window.addEventListener('resize',()=>{setChromeH();});
window.addEventListener('storage',e=>{if(e.key===STORE){S=load();render(false);}});

/* ===== start ===== */
document.body.appendChild(tip);
const r0=parseHash();UI.page=r0.page;UI.siteId=r0.siteId||null;
render(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setChromeH();});
window.__agbi={state:()=>S,ui:UI,metrics};
})();

</script>
</body>
</html>
